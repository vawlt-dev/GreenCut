<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <rect width="300" height="300" fill="#f0fdfa" rx="16"/>

  <!-- Uncut lawn (tall grass, back) -->
  <rect x="20" y="170" width="260" height="90" fill="#0d9488" rx="4"/>
  <!-- Mow stripes on cut portion -->
  <rect x="20" y="170" width="130" height="16" fill="#0f766e" opacity="0.6"/>
  <rect x="20" y="195" width="130" height="16" fill="#0f766e" opacity="0.6"/>
  <rect x="20" y="220" width="130" height="16" fill="#0f766e" opacity="0.6"/>
  <rect x="20" y="245" width="130" height="16" fill="#0f766e" opacity="0.6"/>

  <!-- Tall grass blades (uncut right side) -->
  <line x1="165" y1="170" x2="160" y2="148" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
  <line x1="175" y1="170" x2="178" y2="144" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
  <line x1="185" y1="170" x2="181" y2="146" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
  <line x1="195" y1="170" x2="198" y2="143" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
  <line x1="205" y1="170" x2="202" y2="147" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
  <line x1="215" y1="170" x2="218" y2="144" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
  <line x1="225" y1="170" x2="221" y2="148" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
  <line x1="235" y1="170" x2="238" y2="145" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
  <line x1="245" y1="170" x2="241" y2="149" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
  <line x1="255" y1="170" x2="257" y2="146" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
  <line x1="265" y1="170" x2="262" y2="150" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
  <line x1="275" y1="170" x2="278" y2="147" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>

  <!-- Cut / uncut boundary -->
  <line x1="150" y1="145" x2="150" y2="170" stroke="#99f6e4" stroke-width="2" stroke-dasharray="4,3" opacity="0.7"/>

  <!-- Lawnmower -->
  <rect x="118" y="182" width="58" height="27" fill="#f97316" rx="5"/>
  <rect x="171" y="178" width="14" height="20" fill="#ea580c" rx="3"/>
  <circle cx="130" cy="212" r="10" fill="#1e293b"/>
  <circle cx="130" cy="212" r="4" fill="#64748b"/>
  <circle cx="162" cy="212" r="10" fill="#1e293b"/>
  <circle cx="162" cy="212" r="4" fill="#64748b"/>
  <!-- Handle -->
  <line x1="124" y1="184" x2="94" y2="155" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/>
  <line x1="140" y1="184" x2="110" y2="155" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/>
  <line x1="94" y1="155" x2="110" y2="155" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/>

  <!-- Person -->
  <circle cx="72" cy="112" r="18" fill="#5eead4"/>
  <path d="M58,103 Q72,92 86,103" fill="#0f766e"/>
  <rect x="62" y="130" width="20" height="34" fill="#0d9488" rx="4"/>
  <!-- Arms to handle -->
  <line x1="62" y1="140" x2="96" y2="154" stroke="#0d9488" stroke-width="8" stroke-linecap="round"/>
  <!-- Legs walking -->
  <line x1="66" y1="164" x2="56" y2="200" stroke="#0d9488" stroke-width="8" stroke-linecap="round"/>
  <line x1="76" y1="164" x2="84" y2="198" stroke="#0d9488" stroke-width="8" stroke-linecap="round"/>

  <text x="150" y="282" font-family="Arial" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="bold">Lawn Mowing</text>
</svg>
