<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <rect width="300" height="300" fill="#f0fdfa" rx="16"/>

  <!-- Ground -->
  <rect x="20" y="242" width="260" height="18" fill="#0d9488" rx="4"/>

  <!-- Hedge body -->
  <rect x="168" y="80" width="96" height="164" fill="#0d9488" rx="6"/>
  <!-- Hedge depth shading -->
  <rect x="168" y="80" width="96" height="164" fill="url(#hedgeshade)" rx="6"/>
  <!-- Bumpy top (before trim) on right side only -->
  <ellipse cx="178" cy="80" rx="16" ry="11" fill="#0f766e"/>
  <ellipse cx="200" cy="76" rx="17" ry="13" fill="#0d9488"/>
  <ellipse cx="222" cy="79" rx="16" ry="11" fill="#0f766e"/>
  <ellipse cx="244" cy="77" rx="15" ry="12" fill="#0d9488"/>
  <ellipse cx="260" cy="80" rx="12" ry="10" fill="#0f766e"/>
  <!-- Left face of hedge (freshly cut, flat) -->
  <rect x="164" y="72" width="10" height="170" fill="#5eead4" rx="3" opacity="0.35"/>
  <!-- Clippings on ground -->
  <ellipse cx="155" cy="244" rx="14" ry="5" fill="#0f766e" opacity="0.7"/>
  <rect x="138" y="240" width="8" height="4" fill="#0f766e" rx="1" transform="rotate(-20,142,242)"/>
  <rect x="152" y="237" width="6" height="3" fill="#0f766e" rx="1" transform="rotate(15,155,238)"/>
  <rect x="165" y="241" width="7" height="3" fill="#0f766e" rx="1" transform="rotate(-10,168,242)"/>

  <!-- Person -->
  <circle cx="100" cy="96" r="18" fill="#5eead4"/>
  <path d="M86,87 Q100,76 114,87" fill="#0f766e"/>
  <!-- Body -->
  <rect x="89" y="114" width="22" height="44" fill="#0d9488" rx="4"/>
  <!-- Legs -->
  <line x1="93" y1="158" x2="83" y2="200" stroke="#0d9488" stroke-width="9" stroke-linecap="round"/>
  <line x1="103" y1="158" x2="112" y2="200" stroke="#0d9488" stroke-width="9" stroke-linecap="round"/>
  <!-- Arm holding trimmer out -->
  <line x1="111" y1="124" x2="155" y2="112" stroke="#0d9488" stroke-width="8" stroke-linecap="round"/>
  <!-- Other arm (steadying) -->
  <line x1="89" y1="128" x2="76" y2="148" stroke="#0d9488" stroke-width="8" stroke-linecap="round"/>

  <!-- Hedge trimmer -->
  <rect x="146" y="104" width="32" height="11" fill="#f97316" rx="3"/>
  <!-- Blade bar -->
  <rect x="142" y="113" width="38" height="5" fill="#1e293b" rx="2"/>
  <!-- Blade teeth -->
  <rect x="144" y="117" width="4" height="4" fill="#94a3b8" rx="1"/>
  <rect x="151" y="117" width="4" height="4" fill="#94a3b8" rx="1"/>
  <rect x="158" y="117" width="4" height="4" fill="#94a3b8" rx="1"/>
  <rect x="165" y="117" width="4" height="4" fill="#94a3b8" rx="1"/>
  <rect x="172" y="117" width="4" height="4" fill="#94a3b8" rx="1"/>

  <!-- Flying clippings -->
  <rect x="160" y="130" width="7" height="4" fill="#0f766e" rx="1" transform="rotate(25,163,132)"/>
  <rect x="148" y="136" width="5" height="3" fill="#0f766e" rx="1" transform="rotate(-15,150,137)"/>
  <rect x="170" y="140" width="6" height="3" fill="#0f766e" rx="1" transform="rotate(40,173,141)"/>
  <rect x="155" y="144" width="4" height="3" fill="#0f766e" rx="1" transform="rotate(-30,157,145)"/>

  <text x="150" y="286" font-family="Arial" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="bold">Hedge Trimming</text>
</svg>
