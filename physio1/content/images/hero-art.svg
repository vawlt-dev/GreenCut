<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#134e4a"/>
      <stop offset="100%" style="stop-color:#0d9488"/>
    </linearGradient>
  </defs>

  <!-- Sky/background -->
  <rect width="520" height="380" fill="url(#bg)" rx="12"/>

  <!-- House -->
  <rect x="55" y="108" width="165" height="130" fill="#0f766e"/>
  <polygon points="38,112 238,112 138,55" fill="#134e4a"/>
  <!-- Door -->
  <rect x="118" y="178" width="40" height="60" fill="#99f6e4" rx="4"/>
  <circle cx="152" cy="210" r="3" fill="#0d9488"/>
  <!-- Windows -->
  <rect x="70" y="128" width="40" height="35" fill="#99f6e4" rx="3"/>
  <rect x="162" y="128" width="40" height="35" fill="#99f6e4" rx="3"/>
  <line x1="90" y1="128" x2="90" y2="163" stroke="#0f766e" stroke-width="2"/>
  <line x1="70" y1="145" x2="110" y2="145" stroke="#0f766e" stroke-width="2"/>
  <line x1="182" y1="128" x2="182" y2="163" stroke="#0f766e" stroke-width="2"/>
  <line x1="162" y1="145" x2="202" y2="145" stroke="#0f766e" stroke-width="2"/>

  <!-- Lawn with mow stripes -->
  <rect x="0" y="268" width="520" height="112" fill="#0f766e"/>
  <rect x="0" y="268" width="520" height="18" fill="#0d9488" opacity="0.55"/>
  <rect x="0" y="293" width="520" height="18" fill="#0d9488" opacity="0.55"/>
  <rect x="0" y="318" width="520" height="18" fill="#0d9488" opacity="0.55"/>
  <rect x="0" y="343" width="520" height="18" fill="#0d9488" opacity="0.55"/>

  <!-- Shrubs left -->
  <ellipse cx="22" cy="262" rx="24" ry="19" fill="#0f766e"/>
  <ellipse cx="42" cy="258" rx="20" ry="16" fill="#134e4a"/>

  <!-- Shrubs right -->
  <ellipse cx="478" cy="260" rx="24" ry="19" fill="#0f766e"/>
  <ellipse cx="497" cy="256" rx="18" ry="15" fill="#134e4a"/>

  <!-- Flower bed -->
  <ellipse cx="260" cy="263" rx="30" ry="14" fill="#0f766e"/>
  <circle cx="248" cy="256" r="7" fill="#f97316"/>
  <circle cx="262" cy="253" r="7" fill="#99f6e4"/>
  <circle cx="275" cy="257" r="6" fill="#f97316"/>

  <!-- Lawnmower -->
  <rect x="325" y="282" width="72" height="34" fill="#f97316" rx="6"/>
  <rect x="392" y="277" width="18" height="26" fill="#ea580c" rx="3"/>
  <!-- Exhaust puff -->
  <circle cx="412" cy="270" r="5" fill="rgba(255,255,255,0.15)"/>
  <circle cx="420" cy="263" r="4" fill="rgba(255,255,255,0.10)"/>
  <!-- Wheels -->
  <circle cx="341" cy="319" r="12" fill="#1e293b"/>
  <circle cx="341" cy="319" r="5" fill="#64748b"/>
  <circle cx="382" cy="319" r="12" fill="#1e293b"/>
  <circle cx="382" cy="319" r="5" fill="#64748b"/>
  <!-- Handle bars -->
  <line x1="337" y1="284" x2="300" y2="248" stroke="#ccfbf1" stroke-width="5" stroke-linecap="round"/>
  <line x1="358" y1="284" x2="321" y2="248" stroke="#ccfbf1" stroke-width="5" stroke-linecap="round"/>
  <line x1="300" y1="248" x2="321" y2="248" stroke="#ccfbf1" stroke-width="5" stroke-linecap="round"/>

  <!-- Person pushing mower -->
  <circle cx="276" cy="218" r="18" fill="#ccfbf1"/>
  <path d="M262,209 Q276,198 290,209" fill="#5eead4"/>
  <rect x="265" y="236" width="22" height="38" fill="#5eead4" rx="5"/>
  <!-- Arms -->
  <line x1="266" y1="246" x2="303" y2="249" stroke="#5eead4" stroke-width="9" stroke-linecap="round"/>
  <!-- Legs walking -->
  <line x1="270" y1="274" x2="260" y2="314" stroke="#5eead4" stroke-width="9" stroke-linecap="round"/>
  <line x1="280" y1="274" x2="292" y2="312" stroke="#5eead4" stroke-width="9" stroke-linecap="round"/>

  <!-- Cut grass boundary line -->
  <line x1="130" y1="268" x2="325" y2="268" stroke="#99f6e4" stroke-width="2" stroke-dasharray="5,4" opacity="0.45"/>

  <!-- Decorative leaf badge (replacing medical cross) -->
  <ellipse cx="76" cy="72" rx="16" ry="26" fill="rgba(255,255,255,0.13)" transform="rotate(-25,76,72)"/>
  <line x1="76" y1="48" x2="76" y2="96" stroke="rgba(153,246,228,0.35)" stroke-width="2"/>
  <ellipse cx="84" cy="65" rx="8" ry="14" fill="rgba(255,255,255,0.08)" transform="rotate(20,84,65)"/>

  <!-- Decorative circles -->
  <circle cx="462" cy="48" r="40" fill="rgba(255,255,255,0.06)"/>
  <circle cx="462" cy="332" r="26" fill="rgba(255,255,255,0.08)"/>

  <!-- Grass blade decorations (replacing heartbeat line) -->
  <line x1="430" y1="130" x2="422" y2="100" stroke="rgba(153,246,228,0.3)" stroke-width="3" stroke-linecap="round"/>
  <line x1="443" y1="128" x2="440" y2="97" stroke="rgba(153,246,228,0.3)" stroke-width="3" stroke-linecap="round"/>
  <line x1="455" y1="133" x2="456" y2="102" stroke="rgba(153,246,228,0.3)" stroke-width="3" stroke-linecap="round"/>
  <line x1="466" y1="130" x2="470" y2="100" stroke="rgba(153,246,228,0.25)" stroke-width="3" stroke-linecap="round"/>
</svg>
