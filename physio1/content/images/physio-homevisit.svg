<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <rect width="300" height="300" fill="#f0fdfa" rx="16"/>

  <!-- Lawn -->
  <rect x="20" y="220" width="260" height="50" fill="#0d9488" rx="4"/>
  <rect x="20" y="220" width="260" height="14" fill="#0f766e" opacity="0.55"/>
  <rect x="20" y="242" width="260" height="14" fill="#0f766e" opacity="0.55"/>

  <!-- Garden bed -->
  <rect x="20" y="190" width="260" height="34" fill="#92400e" rx="5" opacity="0.55"/>

  <!-- Plants in bed -->
  <ellipse cx="55" cy="188" rx="20" ry="15" fill="#0d9488"/>
  <ellipse cx="55" cy="185" rx="14" ry="10" fill="#5eead4"/>
  <ellipse cx="100" cy="186" rx="22" ry="16" fill="#0d9488"/>
  <ellipse cx="100" cy="183" rx="15" ry="11" fill="#5eead4"/>
  <ellipse cx="148" cy="189" rx="18" ry="13" fill="#0d9488"/>
  <ellipse cx="200" cy="187" rx="20" ry="14" fill="#0d9488"/>
  <ellipse cx="200" cy="184" rx="13" ry="10" fill="#5eead4"/>
  <ellipse cx="248" cy="188" rx="17" ry="13" fill="#0d9488"/>

  <!-- Wheelbarrow -->
  <path d="M198,195 Q212,188 228,192 L230,208 Q214,214 198,210 Z" fill="#f97316"/>
  <!-- Barrow contents (leaves) -->
  <ellipse cx="212" cy="198" rx="10" ry="5" fill="#0f766e" transform="rotate(-8,212,198)"/>
  <ellipse cx="222" cy="196" rx="8" ry="4" fill="#0d9488" transform="rotate(12,222,196)"/>
  <!-- Handles -->
  <line x1="198" y1="202" x2="172" y2="218" stroke="#ea580c" stroke-width="5" stroke-linecap="round"/>
  <line x1="228" y1="200" x2="228" y2="218" stroke="#ea580c" stroke-width="4" stroke-linecap="round"/>
  <!-- Wheel -->
  <circle cx="172" cy="220" r="9" fill="#1e293b"/>
  <circle cx="172" cy="220" r="4" fill="#64748b"/>

  <!-- Person kneeling with trowel -->
  <circle cx="135" cy="112" r="18" fill="#5eead4"/>
  <path d="M121,103 Q135,92 149,103" fill="#0f766e"/>
  <!-- Body leaning forward -->
  <rect x="124" y="130" width="22" height="36" fill="#0d9488" rx="4" transform="rotate(12,135,148)"/>
  <!-- Arm with trowel -->
  <line x1="144" y1="136" x2="172" y2="158" stroke="#0d9488" stroke-width="8" stroke-linecap="round"/>
  <!-- Trowel -->
  <rect x="168" y="154" width="16" height="7" fill="#f97316" rx="2" transform="rotate(35,176,157)"/>
  <line x1="176" y1="162" x2="182" y2="174" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <!-- Other arm back for support -->
  <line x1="124" y1="140" x2="105" y2="158" stroke="#0d9488" stroke-width="8" stroke-linecap="round"/>
  <!-- Legs kneeling -->
  <line x1="128" y1="166" x2="115" y2="196" stroke="#0d9488" stroke-width="9" stroke-linecap="round"/>
  <line x1="138" y1="168" x2="150" y2="195" stroke="#0d9488" stroke-width="9" stroke-linecap="round"/>

  <!-- Rake leaning nearby -->
  <line x1="68" y1="100" x2="58" y2="192" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
  <line x1="46" y1="100" x2="56" y2="100" stroke="#0f766e" stroke-width="3"/>
  <line x1="48" y1="104" x2="55" y2="104" stroke="#0f766e" stroke-width="3"/>
  <line x1="50" y1="108" x2="57" y2="108" stroke="#0f766e" stroke-width="3"/>
  <line x1="52" y1="112" x2="59" y2="112" stroke="#0f766e" stroke-width="3"/>
  <rect x="44" y="96" width="22" height="22" fill="#f97316" rx="3" opacity="0.8"/>
  <!-- Rake teeth -->
  <line x1="47" y1="118" x2="44" y2="128" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="52" y1="118" x2="50" y2="128" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="57" y1="118" x2="56" y2="128" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="62" y1="118" x2="62" y2="128" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round"/>

  <text x="150" y="288" font-family="Arial" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="bold">Garden Cleanup</text>
</svg>
